[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benchproof-backend"
version = "0.1.0"
description = "BenchProof Agentic Engineering Assurance Runtime Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.103.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.25.0",
    "ruff>=0.0.280",
]

[tool.hatch.build.targets.wheel]
packages = ["benchproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = ["fixtures"]
